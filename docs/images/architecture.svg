<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F07A1A"/>
    </marker>
    <marker id="chev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3E7D47"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="670" rx="24" fill="#FAF6EE"/>

  <!-- Title -->
  <text x="40" y="58" font-size="26" font-weight="700" fill="#1F4D2B">How Musafir AI works</text>
  <text x="40" y="86" font-size="14" fill="#5B6B5E">The server pre-builds a trip pack; the phone plays it as you drive, online or offline.</text>

  <!-- ===== Mobile app ===== -->
  <rect x="40" y="120" width="340" height="440" rx="18" fill="#FFFFFF" stroke="#3E7D47" stroke-width="2"/>
  <text x="64" y="158" font-size="19" font-weight="700" fill="#1F4D2B">Mobile app</text>
  <text x="64" y="180" font-size="13" fill="#5B6B5E">Expo · React Native</text>

  <g font-size="14">
    <rect x="64" y="205" width="292" height="72" rx="12" fill="#EEF5EC"/>
    <text x="84" y="235" font-weight="700" fill="#1F4D2B">Background GPS &amp; geofences</text>
    <text x="84" y="257" font-size="12.5" fill="#5B6B5E">Triggers each story as you approach</text>

    <rect x="64" y="293" width="292" height="72" rx="12" fill="#EEF5EC"/>
    <text x="84" y="323" font-weight="700" fill="#1F4D2B">Audio queue &amp; player</text>
    <text x="84" y="345" font-size="12.5" fill="#5B6B5E">Never overlaps, pauses or lowers music</text>

    <rect x="64" y="381" width="292" height="72" rx="12" fill="#EEF5EC"/>
    <text x="84" y="411" font-weight="700" fill="#1F4D2B">Offline trip store</text>
    <text x="84" y="433" font-size="12.5" fill="#5B6B5E">Manifest + mp3s saved on the phone</text>

    <rect x="64" y="469" width="292" height="72" rx="12" fill="#EEF5EC"/>
    <text x="84" y="499" font-weight="700" fill="#1F4D2B">Push-to-talk mic</text>
    <text x="84" y="521" font-size="12.5" fill="#5B6B5E">Ask Musafir anything by voice</text>
  </g>

  <!-- ===== Arrows between app and backend ===== -->
  <g font-size="13" text-anchor="middle">
    <line x1="514" y1="270" x2="388" y2="270" stroke="#F07A1A" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="450" y="258" font-weight="700" fill="#1F4D2B">trip pack</text>
    <text x="450" y="290" font-size="12" fill="#5B6B5E">route + stories + audio</text>

    <line x1="386" y1="412" x2="512" y2="412" stroke="#F07A1A" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="450" y="400" font-weight="700" fill="#1F4D2B">voice question</text>
    <line x1="514" y1="446" x2="388" y2="446" stroke="#F07A1A" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="450" y="468" font-weight="700" fill="#1F4D2B">spoken answer</text>
  </g>

  <!-- ===== Backend ===== -->
  <rect x="520" y="120" width="640" height="440" rx="18" fill="#FFFFFF" stroke="#3E7D47" stroke-width="2"/>
  <text x="544" y="158" font-size="19" font-weight="700" fill="#1F4D2B">Backend</text>
  <text x="544" y="180" font-size="13" fill="#5B6B5E">Express · TypeScript · Google Cloud Run</text>

  <!-- Trip pipeline -->
  <text x="544" y="220" font-size="12" font-weight="700" fill="#F07A1A" letter-spacing="1.2">TRIP PIPELINE</text>
  <g text-anchor="middle">
    <rect x="544" y="232" width="108" height="70" rx="12" fill="#1F4D2B"/>
    <text x="598" y="262" font-size="14" font-weight="700" fill="#FFFFFF">Route</text>
    <text x="598" y="283" font-size="10.5" fill="#CFE3CC">Google Routes</text>

    <rect x="664" y="232" width="108" height="70" rx="12" fill="#1F4D2B"/>
    <text x="718" y="262" font-size="14" font-weight="700" fill="#FFFFFF">Discover</text>
    <text x="718" y="283" font-size="10.5" fill="#CFE3CC">Places, Wikipedia</text>

    <rect x="784" y="232" width="108" height="70" rx="12" fill="#1F4D2B"/>
    <text x="838" y="262" font-size="14" font-weight="700" fill="#FFFFFF">Curate &amp; plan</text>
    <text x="838" y="283" font-size="10.5" fill="#CFE3CC">side of road, timing</text>

    <rect x="904" y="232" width="108" height="70" rx="12" fill="#1F4D2B"/>
    <text x="958" y="262" font-size="14" font-weight="700" fill="#FFFFFF">Write</text>
    <text x="958" y="283" font-size="10.5" fill="#CFE3CC">Gemini, Vertex AI</text>

    <rect x="1024" y="232" width="108" height="70" rx="12" fill="#F07A1A"/>
    <text x="1078" y="262" font-size="14" font-weight="700" fill="#FFFFFF">Narrate</text>
    <text x="1078" y="283" font-size="10.5" fill="#FFF1E3">Gnani TTS → mp3</text>
  </g>
  <g stroke="#3E7D47" stroke-width="2" marker-end="url(#chev)">
    <line x1="653" y1="267" x2="662" y2="267"/>
    <line x1="773" y1="267" x2="782" y2="267"/>
    <line x1="893" y1="267" x2="902" y2="267"/>
    <line x1="1013" y1="267" x2="1022" y2="267"/>
  </g>
  <text x="544" y="332" font-size="12.5" fill="#5B6B5E">Stories are cached per place × language × voice, so routes that share places build fast.</text>

  <!-- Ask pipeline -->
  <text x="544" y="374" font-size="12" font-weight="700" fill="#F07A1A" letter-spacing="1.2">ASK PIPELINE (LIVE MODE)</text>
  <g text-anchor="middle">
    <rect x="544" y="386" width="184" height="70" rx="12" fill="#F07A1A"/>
    <text x="636" y="416" font-size="14" font-weight="700" fill="#FFFFFF">Gnani STT</text>
    <text x="636" y="437" font-size="11" fill="#FFF1E3">speech to text, your language</text>

    <rect x="746" y="386" width="184" height="70" rx="12" fill="#1F4D2B"/>
    <text x="838" y="416" font-size="14" font-weight="700" fill="#FFFFFF">Gemini</text>
    <text x="838" y="437" font-size="11" fill="#CFE3CC">answers with trip + location</text>

    <rect x="948" y="386" width="184" height="70" rx="12" fill="#F07A1A"/>
    <text x="1040" y="416" font-size="14" font-weight="700" fill="#FFFFFF">Gnani TTS</text>
    <text x="1040" y="437" font-size="11" fill="#FFF1E3">spoken reply in your voice</text>
  </g>
  <g stroke="#3E7D47" stroke-width="2" marker-end="url(#chev)">
    <line x1="729" y1="421" x2="744" y2="421"/>
    <line x1="931" y1="421" x2="946" y2="421"/>
  </g>
  <text x="544" y="488" font-size="12.5" fill="#5B6B5E">Every Gnani call goes through one priority queue: keys rotate, long scripts are</text>
  <text x="544" y="506" font-size="12.5" fill="#5B6B5E">chunked on sentence boundaries and the mp3s stitched back together.</text>
  <text x="544" y="536" font-size="12.5" fill="#5B6B5E">All API keys stay on the server. The app only talks to the Musafir API.</text>

  <!-- ===== Services ===== -->
  <text x="600" y="590" font-size="12" font-weight="700" fill="#5B6B5E" text-anchor="middle" letter-spacing="1.2">POWERED BY</text>
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="85" y="602" width="126" height="40" rx="20" fill="#F07A1A"/>
    <text x="148" y="627" fill="#FFFFFF">Gnani Vachana</text>
    <rect x="227" y="602" width="163" height="40" rx="20" fill="#FFFFFF" stroke="#3E7D47" stroke-width="1.5"/>
    <text x="308.5" y="627" fill="#1F4D2B">Gemini · Vertex AI</text>
    <rect x="406" y="602" width="178" height="40" rx="20" fill="#FFFFFF" stroke="#3E7D47" stroke-width="1.5"/>
    <text x="495" y="627" fill="#1F4D2B">Google Maps Platform</text>
    <rect x="600" y="602" width="96" height="40" rx="20" fill="#FFFFFF" stroke="#3E7D47" stroke-width="1.5"/>
    <text x="648" y="627" fill="#1F4D2B">Wikipedia</text>
    <rect x="712" y="602" width="126" height="40" rx="20" fill="#FFFFFF" stroke="#3E7D47" stroke-width="1.5"/>
    <text x="775" y="627" fill="#1F4D2B">MongoDB Atlas</text>
    <rect x="854" y="602" width="118" height="40" rx="20" fill="#FFFFFF" stroke="#3E7D47" stroke-width="1.5"/>
    <text x="913" y="627" fill="#1F4D2B">Backblaze B2</text>
    <rect x="988" y="602" width="126" height="40" rx="20" fill="#FFFFFF" stroke="#3E7D47" stroke-width="1.5"/>
    <text x="1051" y="627" fill="#1F4D2B">Firebase Auth</text>
  </g>
</svg>
